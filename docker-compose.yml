services:
  catalogo-service:
    build: ./microservicio-catalogo
    container_name: catalogo-service
    ports:
      - "8082:8082"
    environment:
      # Keycloak sigue corriendo en el host (fuera de este compose, ver Paso 1 del PDF),
      # por eso el CONTENEDOR lo alcanza via host.docker.internal en lugar de localhost.
      # NOTA: en este entorno Keycloak quedó publicado en el puerto 8095 (no 8080) -
      # ajusta este valor si tu contenedor de Keycloak usa otro puerto.
      KEYCLOAK_ISSUER_URI: http://host.docker.internal:8095/realms/biblioteca
      # KEYCLOAK_EXPECTED_ISSUER: el valor real del claim "iss" en los tokens - es el host/puerto
      # con el que el CLIENTE (Postman, browser) le pide el token a Keycloak, normalmente localhost.
      KEYCLOAK_EXPECTED_ISSUER: http://localhost:8095/realms/biblioteca
      # Clientes de Keycloak (claim azp) cuyos tokens acepta: el propio y circulacion-service
      # (porque le propaga el token al llamar via Feign).
      KEYCLOAK_ALLOWED_CLIENTS: catalogo-service,circulacion-service
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - biblioteca-net

  notificacion-service:
    build: ./microservicio-notificacion
    container_name: notificacion-service
    ports:
      - "8084:8084"
    environment:
      KEYCLOAK_ISSUER_URI: http://host.docker.internal:8095/realms/biblioteca
      KEYCLOAK_EXPECTED_ISSUER: http://localhost:8095/realms/biblioteca
      KEYCLOAK_ALLOWED_CLIENTS: notificacion-service,circulacion-service
      # RabbitMQ corre en el host (fuera de este compose, ver docs/docker), igual que Keycloak.
      SPRING_RABBITMQ_HOST: host.docker.internal
      # Kafka corre dentro de este compose: se alcanza por nombre de servicio en la red de Docker.
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - kafka
    networks:
      - biblioteca-net

  usuario-service:
    build: ./microservicio-usuarios
    container_name: usuario-service
    ports:
      - "8081:8081"
    environment:
      KEYCLOAK_ISSUER_URI: http://host.docker.internal:8095/realms/biblioteca
      KEYCLOAK_EXPECTED_ISSUER: http://localhost:8095/realms/biblioteca
      # Nadie llama a usuario-service via Feign, asi que solo confia en su propio cliente.
      KEYCLOAK_ALLOWED_CLIENTS: usuario-service
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - biblioteca-net

  circulacion-service:
    build: ./microservicio-circulacion
    container_name: circulacion-service
    ports:
      - "8083:8083"
    environment:
      # El Feign client resuelve esta URL por nombre de servicio dentro de la red de Docker
      CATALOGO_SERVICE_URL: http://catalogo-service:8082
      # Keycloak sigue corriendo en el host (fuera de este compose, ver Paso 1 del PDF),
      # por eso el CONTENEDOR lo alcanza via host.docker.internal en lugar de localhost.
      # NOTA: en este entorno Keycloak quedó publicado en el puerto 8095 (no 8080) -
      # ajusta este valor si tu contenedor de Keycloak usa otro puerto.
      KEYCLOAK_ISSUER_URI: http://host.docker.internal:8095/realms/biblioteca
      # KEYCLOAK_EXPECTED_ISSUER: el valor real del claim "iss" en los tokens - es el host/puerto
      # con el que el CLIENTE (Postman, browser) le pide el token a Keycloak, normalmente localhost.
      KEYCLOAK_EXPECTED_ISSUER: http://localhost:8095/realms/biblioteca
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-}
      # RabbitMQ corre en el host (fuera de este compose, ver docs/docker), igual que Keycloak.
      # Circulacion publica en notificacion.exchange en vez de llamar a notificacion-service via Feign.
      SPRING_RABBITMQ_HOST: host.docker.internal
      # Las devoluciones se publican en el topic Kafka "devolucion-libro" (ver config/KafkaConfig).
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    extra_hosts:
      # Necesario para que host.docker.internal resuelva en Docker sobre Linux;
      # en Docker Desktop (Windows/Mac) ya funciona de forma nativa
      - "host.docker.internal:host-gateway"
    depends_on:
      - catalogo-service
      - kafka
    networks:
      - biblioteca-net

  # Kafka (guia 2_Implementar Kafka...). Se fija la version 7.6.0 en vez de "latest" porque las
  # imagenes cp-kafka 8.x ya no soportan Zookeeper (solo KRaft) y este setup lo usa.
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "22181:2181"
    networks:
      - biblioteca-net

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # kafka:9092 lo usan los contenedores de esta red; localhost:29092 lo usa el host
      # (servicios corridos fuera de Docker, Offset Explorer, kafka-console-* desde el host).
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - biblioteca-net

networks:
  biblioteca-net:
    driver: bridge
