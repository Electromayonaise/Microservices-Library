spring.application.name=biblioteca
spring.datasource.url=jdbc:h2:mem:notificaciondb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
server.port=8084

# RabbitMQ: consume las notificaciones publicadas por circulacion-service via
# NotificacionConsumer (ver config/RabbitMQConfig). Sobreescribible con SPRING_RABBITMQ_HOST,
# p.ej. host.docker.internal desde docker-compose.
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Kafka: consume las devoluciones publicadas por circulacion-service en el topic
# "devolucion-libro" (ver NotificacionService). Sobreescribible con SPRING_KAFKA_BOOTSTRAP_SERVERS,
# p.ej. kafka:9092 desde docker-compose.
spring.kafka.bootstrap-servers=localhost:29092
spring.kafka.consumer.group-id=notificacion-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
# Endurecido respecto a la guia (que usa trusted.packages=*): se ignora el header __TypeId__ del
# productor y siempre se deserializa a NotificacionDTO, para que un mensaje malicioso no pueda
# elegir la clase a instanciar (unsafe deserialization).
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=co.analisys.biblioteca.dto.NotificacionDTO
spring.kafka.consumer.properties.spring.json.trusted.packages=co.analisys.biblioteca.dto

# Seguridad OAuth2/JWT contra Keycloak (mismo patron que circulacion-service:
# keycloak.issuer-uri = URL que el CONTENEDOR usa para llegar a Keycloak (JWKS);
# keycloak.expected-issuer = valor real del claim "iss" tal como lo ve el CLIENTE.
# Sobreescribibles con KEYCLOAK_ISSUER_URI / KEYCLOAK_EXPECTED_ISSUER desde docker-compose.
keycloak.issuer-uri=http://localhost:8080/realms/biblioteca
keycloak.expected-issuer=${keycloak.issuer-uri}
keycloak.jwk-set-uri=${keycloak.issuer-uri}/protocol/openid-connect/certs
keycloak.resource=notificacion-service
# Clientes de Keycloak (claim azp) cuyos tokens este servicio acepta: el propio,
# y circulacion-service porque le propaga el token al llamar via Feign.
keycloak.allowed-clients=notificacion-service,circulacion-service