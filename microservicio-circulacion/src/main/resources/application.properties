spring.application.name=biblioteca
spring.datasource.url=jdbc:h2:mem:circulaciondb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
server.port=8083

# URL del servicio remoto consumido via Feign (sobreescribible por la variable de entorno
# CATALOGO_SERVICE_URL, p.ej. desde docker-compose)
catalogo.service.url=http://localhost:8082

# RabbitMQ: notificaciones de prestamo/devolucion se publican de forma asincronica
# (ver config/RabbitMQConfig) en vez de llamar a notificacion-service via Feign.
# Sobreescribible con SPRING_RABBITMQ_HOST, p.ej. host.docker.internal desde docker-compose.
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Kafka: las devoluciones se publican en el topic "devolucion-libro" (ver config/KafkaConfig).
# Desde el host, Kafka expone el listener PLAINTEXT_HOST en localhost:29092; desde docker-compose
# se sobreescribe con SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092.
spring.kafka.bootstrap-servers=localhost:29092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Seguridad OAuth2/JWT contra Keycloak
# keycloak.issuer-uri: URL que el propio contenedor usa para llegar a Keycloak y descargar las
# llaves publicas (JWKS) - sobreescribible con KEYCLOAK_ISSUER_URI.
# keycloak.expected-issuer: valor exacto que trae el claim "iss" de los tokens emitidos por
# Keycloak (depende del host/puerto con el que el CLIENTE -Postman, browser- pidio el token).
# Cuando se corre en Docker estos dos valores suelen ser distintos (host.docker.internal vs
# localhost) aunque apunten al mismo Keycloak - por eso se separan. Sobreescribible con
# KEYCLOAK_EXPECTED_ISSUER.
keycloak.issuer-uri=http://localhost:8080/realms/biblioteca
keycloak.expected-issuer=${keycloak.issuer-uri}
keycloak.jwk-set-uri=${keycloak.issuer-uri}/protocol/openid-connect/certs
keycloak.auth-server-url=http://localhost:8080
keycloak.realm=biblioteca
keycloak.resource=circulacion-service
keycloak.public-client=false
keycloak.credentials.secret=${KEYCLOAK_CLIENT_SECRET:}
# Clientes de Keycloak (claim azp) cuyos tokens este servicio acepta: solo el propio,
# ya que nadie mas llama a circulacion-service via Feign.
keycloak.allowed-clients=circulacion-service
logging.level.org.springframework.security=DEBUG