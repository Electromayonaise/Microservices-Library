spring.application.name=biblioteca
spring.datasource.url=jdbc:h2:mem:circulaciondb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
server.port=8083

# URLs de los servicios remotos consumidos via Feign (sobreescribibles por variables de entorno
# CATALOGO_SERVICE_URL / NOTIFICACION_SERVICE_URL, p.ej. desde docker-compose)
catalogo.service.url=http://localhost:8082
notificacion.service.url=http://localhost:8084

# Seguridad OAuth2/JWT contra Keycloak
# keycloak.issuer-uri: URL que el propio contenedor usa para llegar a Keycloak y descargar las
# llaves publicas (JWKS) - sobreescribible con KEYCLOAK_ISSUER_URI.
# keycloak.expected-issuer: valor exacto que trae el claim "iss" de los tokens emitidos por
# Keycloak (depende del host/puerto con el que el CLIENTE -Postman, browser- pidio el token).
# Cuando se corre en Docker estos dos valores suelen ser distintos (host.docker.internal vs
# localhost) aunque apunten al mismo Keycloak - por eso se separan. Sobreescribible con
# KEYCLOAK_EXPECTED_ISSUER.
keycloak.issuer-uri=http://localhost:8080/realms/biblioteca
keycloak.expected-issuer=${keycloak.issuer-uri}
keycloak.jwk-set-uri=${keycloak.issuer-uri}/protocol/openid-connect/certs
keycloak.auth-server-url=http://localhost:8080
keycloak.realm=biblioteca
keycloak.resource=circulacion-service
keycloak.public-client=false
keycloak.credentials.secret=${KEYCLOAK_CLIENT_SECRET:}
logging.level.org.springframework.security=DEBUG